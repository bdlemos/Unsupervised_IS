# @package data

nfolds: 10
VALIDATION_SIZE_FOR_LOSS: 0.1

# Default values used when no combo override is passed.
dataset_name: twitter
is_method: biois

# Keep the existing downstream API stable.
dataset: ${data.dataset_name}_${data.is_method}
texts_path: ${oc.env:UNSUPERVISED_IS_RESOURCES,/app/unsupervised-is/resources}/datasets/${data.dataset_name}/texts.txt
scores_path: ${oc.env:UNSUPERVISED_IS_RESOURCES,/app/unsupervised-is/resources}/datasets/${data.dataset_name}/score.txt
external_splits_path: ${oc.env:UNSUPERVISED_IS_RESOURCES,/app/unsupervised-is/resources}/outsel/selection/${data.dataset_name}/split_10_${data.is_method}.pkl
