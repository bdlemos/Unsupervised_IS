# @package model
# ModernBERT with the LEGACY training regime: every run up to 2026-11-02, including the No-IS and
# biO-IS columns of the main table (experiments/2026-09_main-results-jina-v5). Use it only to pair
# new runs with those numbers: python main.py data=<ds>_<method> model=modernbert_legacy
# (run.sh: --model-config modernbert_legacy or MODEL_CONFIG=modernbert_legacy).
#
# Same values as conf/model/modernbert.yaml at ef6dfb9; `regime: legacy` (src/model/slm.py) restores
# its code path: torch Adam with an ineffective 'weight_decay_rate' key (weight decay 0), cumulative
# val-loss patience (stops at the 4th non-improving epoch overall, at most 10 epochs) and prediction
# with the last epoch's weights. model_tag stays 'modernbert' so the output layout is unchanged; keep
# legacy runs in their own RESULTS_DIR. measures.fold_*.json records training_regime: legacy.

type: slm

model_name: answerdotai/ModernBERT-base
model_tag: modernbert

training_args:
  regime: legacy
  max_len: 256
  batch_size: 32
  lr: 5e-5
  num_max_epochs: 10
  patience: 3
  weight_decay_rate: 0.01
  min_val_epoch_impro_delta: 1e-4
  max_grad_norm: 1.0
  warmup_ratio: 0.06

text_representation: raw
